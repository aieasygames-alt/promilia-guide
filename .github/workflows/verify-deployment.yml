name: Verify hosted site
on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'HTTPS origin to check (Pages preview or production)'
        type: string
        required: true
      expected_commit:
        description: 'Optional full commit SHA (also use for rollback verification)'
        type: string
        required: false
      verify_redirects:
        description: 'Check public aliases; requires canonical production origin'
        type: boolean
        default: false
      deployment_mode:
        description: 'Expected build and indexing mode'
        type: choice
        options:
          - preview
          - production
        default: preview
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify deployed responses
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VERIFY_REDIRECTS: ${{ inputs.verify_redirects }}
        shell: bash
        run: |
          args=(--url "$DEPLOYMENT_URL" --mode "$DEPLOYMENT_MODE" --json)
          if [ -n "$EXPECTED_COMMIT" ]; then args+=(--commit "$EXPECTED_COMMIT"); fi
          if [ "$VERIFY_REDIRECTS" = true ]; then args+=(--redirects); fi
          node scripts/verify-site.mjs "${args[@]}" > site-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-site-verification
          path: site-verification.json
